name: Build AETHER OS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/Build-aether.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build bootable AMD64 ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract AETHER builder ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          ZIP_FILE=""

          if [[ -f "AETHER-OS-builder.zip" ]]; then
            ZIP_FILE="AETHER-OS-builder.zip"
          else
            mapfile -t ZIP_FILES < <(
              find . -maxdepth 3 -type f -iname '*.zip' \
                ! -path './.git/*' | sort
            )
            if [[ "${#ZIP_FILES[@]}" -ne 1 ]]; then
              echo "::error::Expected one builder ZIP in the repository."
              printf 'ZIP files found: %s\n' "${ZIP_FILES[*]:-none}"
              exit 1
            fi
            ZIP_FILE="${ZIP_FILES[0]}"
          fi

          mkdir -p "$GITHUB_WORKSPACE/aether-source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/aether-source"
          echo "Extracted: $ZIP_FILE"
          find "$GITHUB_WORKSPACE/aether-source" -maxdepth 4 -type f | sort | head -300

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap xorriso squashfs-tools \
            mtools dosfstools grub-common grub2-common \
            grub-pc-bin grub-efi-amd64-bin \
            rsync curl wget git make gcc g++ python3 \
            qemu-user-static binfmt-support

      - name: Run AETHER build-iso.sh
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC="$GITHUB_WORKSPACE/aether-source"

          mapfile -t SCRIPTS < <(
            find "$SRC" -type f -path '*/scripts/build-iso.sh' \
              ! -path '*/.git/*' | sort
          )

          if [[ "${#SCRIPTS[@]}" -eq 0 ]]; then
            mapfile -t SCRIPTS < <(
              find "$SRC" -type f \
                \( -iname 'build-aether.sh' -o -iname 'build.sh' \) \
                ! -path '*/.git/*' | sort
            )
          fi

          if [[ "${#SCRIPTS[@]}" -eq 0 ]]; then
            echo "::error::Could not find the AETHER build script."
            find "$SRC" -maxdepth 6 -type f | sort
            exit 1
          fi

          BUILD_SCRIPT="${SCRIPTS[0]}"
          SCRIPT_DIR="$(dirname "$BUILD_SCRIPT")"

          if [[ "$SCRIPT_DIR" == */scripts ]]; then
            PROJECT_DIR="$(dirname "$SCRIPT_DIR")"
          else
            PROJECT_DIR="$SCRIPT_DIR"
          fi

          echo "Build script: $BUILD_SCRIPT"
          echo "Project root: $PROJECT_DIR"

          chmod +x "$BUILD_SCRIPT"
          cd "$PROJECT_DIR"

          # Fix compatibility with Ubuntu 24.04 live-build.
          # Its lb config does not accept the plural --bootloaders option.
          # The amd64 iso-hybrid defaults provide the supported boot setup.
          if grep -q -- '--bootloaders' "$BUILD_SCRIPT"; then
            sed -i -E \
              's/--bootloaders[[:space:]]+grub-pc,grub-efi[[:space:]]*//g' \
              "$BUILD_SCRIPT"
          fi

          echo "Checking live-build configuration options..."
          lb config --help >/dev/null

          sudo -E bash "$BUILD_SCRIPT"

      - name: Find and prepare ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/iso-output"

          mapfile -t ISOS < <(
            find "$GITHUB_WORKSPACE" -type f -iname '*.iso' \
              ! -path '*/.git/*' \
              ! -path '*/iso-output/*' | sort
          )

          if [[ "${#ISOS[@]}" -eq 0 ]]; then
            echo "::error::The build did not produce an ISO."
            find "$GITHUB_WORKSPACE/aether-source" -maxdepth 7 -type f | sort | tail -250
            exit 1
          fi

          SELECTED="${ISOS[0]}"
          for candidate in "${ISOS[@]}"; do
            if [[ "$(basename "$candidate")" == "AETHER-OS-01.iso" ]]; then
              SELECTED="$candidate"
              break
            fi
          done

          cp "$SELECTED" "$GITHUB_WORKSPACE/iso-output/AETHER-OS-01.iso"
          ls -lh "$GITHUB_WORKSPACE/iso-output/AETHER-OS-01.iso"
          sha256sum "$GITHUB_WORKSPACE/iso-output/AETHER-OS-01.iso" \
            | tee "$GITHUB_WORKSPACE/iso-output/SHA256SUMS.txt"

      - name: Upload AETHER OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-OS-01-iso
          path: iso-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
