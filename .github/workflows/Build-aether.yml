name: Build AETHER OS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "AETHER-OS-builder.zip"
      - ".github/workflows/Build-aether.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build bootable AMD64 ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap debian-archive-keyring \
            xorriso squashfs-tools mtools dosfstools \
            grub-common grub2-common grub-pc-bin grub-efi-amd64-bin \
            rsync curl wget git make gcc g++ python3 \
            qemu-user-static binfmt-support unzip

      - name: Extract AETHER OS source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/aether-source"
          if [ -f "$GITHUB_WORKSPACE/AETHER-OS-builder.zip" ]; then
            ZIP="$GITHUB_WORKSPACE/AETHER-OS-builder.zip"
          else
            mapfile -t ZIPS < <(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name '*.zip')
            if [ "${#ZIPS[@]}" -ne 1 ]; then
              echo "::error::Expected AETHER-OS-builder.zip or exactly one ZIP archive."
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name '*.zip' -print
              exit 1
            fi
            ZIP="${ZIPS[0]}"
          fi
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/aether-source"

          mapfile -t SCRIPTS < <(find "$GITHUB_WORKSPACE/aether-source" -type f -path '*/scripts/build-iso.sh')
          if [ "${#SCRIPTS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one scripts/build-iso.sh."
            find "$GITHUB_WORKSPACE/aether-source" -maxdepth 6 -type f -print
            exit 1
          fi

          echo "BUILD_SCRIPT=${SCRIPTS[0]}" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$(dirname "$(dirname "${SCRIPTS[0]}")")" >> "$GITHUB_ENV"

      - name: Configure Debian mirrors and keyring
        shell: bash
        run: |
          set -euo pipefail
          echo "Build script: $BUILD_SCRIPT"
          echo "Project root: $PROJECT_ROOT"

          # Ubuntu's packaged live-build otherwise inherits Ubuntu's mirror
          # defaults, which cannot provide Debian's trixie suite.
          # Force every live-build stage to use the Debian repositories.
          python3 - "$BUILD_SCRIPT" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          old = "--distribution trixie"
          new = (
              "--distribution trixie "
              "--mirror-bootstrap https://deb.debian.org/debian "
              "--mirror-chroot https://deb.debian.org/debian "
              "--mirror-binary https://deb.debian.org/debian "
              "--mirror-chroot-security https://security.debian.org/debian-security"
          )
          if old not in s:
              raise SystemExit("Could not find '--distribution trixie' in build-iso.sh")
          s = s.replace(old, new, 1)

          # Ubuntu's live-build version does not support this option.
          import re
          s = re.sub(r'--bootloaders\s+grub-pc,grub-efi\s*', '', s)
          p.write_text(s)
          PY

          test -s /usr/share/keyrings/debian-archive-keyring.gpg
          live-build --version || true
          lb config --help >/dev/null

      - name: Build ISO
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          sudo -E bash "$BUILD_SCRIPT"

      - name: Collect ISO and checksum
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          mapfile -t ISOS < <(find "$PROJECT_ROOT" -type f -iname '*.iso' -size +10M)
          if [ "${#ISOS[@]}" -eq 0 ]; then
            echo "::error::Build finished but no ISO was found."
            find "$PROJECT_ROOT" -maxdepth 5 -type f | sort | tail -200
            exit 1
          fi
          ISO="${ISOS[0]}"
          cp "$ISO" "$GITHUB_WORKSPACE/output/AETHER-OS-01.iso"
          cd "$GITHUB_WORKSPACE/output"
          sha256sum AETHER-OS-01.iso > SHA256SUMS
          ls -lh AETHER-OS-01.iso SHA256SUMS

      - name: Upload AETHER OS ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-OS-01-iso
          path: output/*
          if-no-files-found: error
          retention-days: 14
